<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ActaMundi — Mark animation</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden;cursor:pointer}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { buildGlobe, setOpen } from './globe.js';
const q = new URLSearchParams(location.search);
const loop = q.has('loop');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
if (q.get('bg')) scene.background = new THREE.Color('#' + q.get('bg'));
const cam = new THREE.PerspectiveCamera(28, 1, 0.01, 10);
cam.position.set(0, 0.04, 0.6); cam.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9cfc2, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(0.5, 0.8, 0.6); scene.add(key);
const rim = new THREE.DirectionalLight(0xa8ecec, 1.1); rim.position.set(-0.6, 0.2, -0.5); scene.add(rim);
const globe = buildGlobe(THREE, { stand: false });
scene.add(globe);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
let t0 = performance.now(), px = 0, py = 0, tx = 0, ty = 0;
addEventListener('pointermove', e => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; });
addEventListener('pointerleave', () => { tx = ty = 0; });
addEventListener('click', () => { t0 = performance.now(); });
function frame(now) {
  let s = (now - t0) / 1000;
  if (loop && s > 11) { t0 = now; s = 0; }
  const o = reduce ? 1 : ease(Math.min(1, Math.max(0, (s - 0.4) / 2.8)));
  setOpen(globe, o);
  px += (tx - px) * .05; py += (ty - py) * .05;
  globe.rotation.y = -0.55 + o * 0.9 + (reduce ? 0 : Math.max(0, s - 3.2) * 0.16) + px * 0.6;
  globe.rotation.x = 0.16 + py * 0.3;
  globe.rotation.z = (1 - o) * -0.08;
  const w = innerWidth, h = innerHeight;
  if (renderer.domElement.width !== Math.floor(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
